#Eureka server uses this application name as service id for this config server
spring.application.name=CONFIG-SERVER
server.port=8888
#to make this config server register with eureka server as a client we need to provide eureka server url
eureka.instance.client.serverUrl.defaultZone=http://localhost:8761/eureka/

#When this config server starts, it copies all configuration files from git
spring.cloud.config.server.git.uri=https://github.com/JaiRam19/config-server-repo
spring.cloud.config.server.git.clone-on-start=true
spring.cloud.config.server.git.default-label=main
